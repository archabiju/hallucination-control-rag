# ==============================================================================
# Explainability-Driven Hallucination Detection Framework — Configuration
# ==============================================================================

# ── Paths ─────────────────────────────────────────────────────────────────────
paths:
  corpus_dir: "data/corpus"           # Place domain PDFs/TXTs here
  index_dir:  "data/index"            # FAISS index + metadata saved here

# ── Ingestion / Chunking ──────────────────────────────────────────────────────
ingestion:
  chunk_size:    512     # Tokens per chunk
  chunk_overlap:  50     # Overlapping tokens between adjacent chunks
  supported_extensions: [".pdf", ".docx", ".txt", ".md"]

# ── Retrieval ─────────────────────────────────────────────────────────────────
retrieval:
  embedding_model: "sentence-transformers/all-MiniLM-L6-v2"
  top_k: 8               # Top-K chunks retrieved per query (raised from 5 so there is
                         # more real material to draw a longer grounded answer from)
  embedding_dim: 384    # Output dim of all-MiniLM-L6-v2

# ── Generation (Local Ollama LLM) ────────────────────────────────────────────
generation:
  ollama_base_url: "http://localhost:11434"
  model_name: "mistral"   # or "llama3", "phi3" — whatever you have pulled
  temperature: 0.1
  max_tokens: 1200        # raised from 512 so longer, well-explained answers aren't cut off
  system_prompt: >
    You are a precise, factual assistant. Answer ONLY using the provided context.
    Give a thorough, well-explained answer: elaborate on the relevant points,
    explain the reasoning or mechanism behind them, and connect related pieces of
    context together into a coherent explanation, rather than a one-line answer.
    You may elaborate and explain at length, but every claim you make must be
    traceable to the provided context — do not add facts, figures, or details that
    are not present in it. If the context does not support the answer, or only
    partially supports it, say so explicitly rather than filling the gap yourself.

# ── NLI Entailment Detector ──────────────────────────────────────────────────
nli:
  model: "cross-encoder/nli-deberta-v3-small"
  # The detector reads id2label from the checkpoint. For this model:
  # CONTRADICTION=0, ENTAILMENT=1, NEUTRAL=2.
  entailment_label_idx: 1
  contradiction_label_idx: 0

# ── BERTScore ────────────────────────────────────────────────────────────────
bertscore:
  lang: "en"
  model_type: "distilbert-base-uncased"   # Lightweight offline model

# ── Hallucination Detection Thresholds ───────────────────────────────────────
detection:
  # Sentence-level verification (SummaC-style): verify each claim against short
  # evidence windows instead of whole 512-token chunks. false = chunk-level baseline.
  use_evidence_windows: true
  window_size:  2     # consecutive sentences per window
  window_top_n: 4     # windows verified per claim (most similar by SBERT cosine)

  # Weights for aggregated support score
  weight_nli:        0.45
  weight_bertscore:  0.35
  weight_cosine:     0.20

  # Tri-state thresholds
  high_support_threshold:    0.75   # Score >= this → Answer + citations
  medium_support_threshold:  0.50   # Score >= this → Partial answer with flags
  # Score < medium_support_threshold → Block + clarify

# ── Decision Controller ──────────────────────────────────────────────────────
controller:
  citation_format: "[{source}, p.{page}]"   # e.g. [report.pdf, p.3]
  max_block_ratio: 0.5   # If > 50% sentences hallucinated, block entire answer

# ── Evaluation ───────────────────────────────────────────────────────────────
evaluation:
  test_set_path: "evaluation/test_set.json"
  output_dir:    "evaluation/results"
